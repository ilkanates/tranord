# TraNord — tek origin.
#
# İstemci ve API aynı adreste durur: tarayıcı için CORS diye bir mesele
# kalmaz, websocket de aynı host üzerinden yükseltilir.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /opt/tranord/client/dist;
    index index.html;

    # Derlenmiş varlıklar içerik-adresli (hash'li) → uzun önbellek
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Socket.io: websocket yükseltmesi ZORUNLU, tampon kapalı
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3311;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        # Dünya sessizken bile bağlantı kopmasın (kalp atışı 30 sn)
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Kimlik doğrulama uçları — /auth/login hız sınırı sunucu tarafında,
    # gerçek IP'yi görebilmesi için X-Forwarded-For geçiyor (bkz. auth.js)
    location /auth/ {
        proxy_pass http://127.0.0.1:3311;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Tek sayfalık uygulama: bilinmeyen yol index.html'e düşer
    location / {
        try_files $uri $uri/ /index.html;
    }

    client_max_body_size 2m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
