<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>TraNord — Giriş</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --abyss:#050a12; --panel:rgba(16,30,47,.92); --line:rgba(45,76,115,.45);
    --line-bright:#2d4c73; --ice:#7fd4ff; --ice-deep:#3d9fd6; --frost:#dceefc;
    --text:#cfe0f0; --dim:#8199b3; --faint:#59748f; --good:#4ecfa8; --danger:#e8636f;
    --head:'Cormorant Garamond',Garamond,Georgia,serif;
    --ui:'Jost','Segoe UI',system-ui,sans-serif;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; overflow:hidden; }
  body {
    background:var(--abyss); color:var(--text); font-family:var(--ui);
    display:grid; place-items:center; position:relative;
  }

  /* ── Fiyort manzarası ── */
  #bg { position:fixed; inset:0; z-index:0; }
  #bg svg { width:100%; height:100%; display:block; }

  .card {
    position:relative; z-index:2;
    width:min(400px, calc(100vw - 32px));
    background:var(--panel); border:1px solid var(--line-bright);
    border-radius:10px; padding:30px 32px 26px;
    backdrop-filter:blur(16px) saturate(1.15);
    box-shadow:0 22px 60px rgba(0,0,0,.65), 0 0 0 1px rgba(127,212,255,.06);
  }
  .brand { display:flex; align-items:center; justify-content:center; gap:10px; }
  .brand svg { flex-shrink:0; }
  h1 {
    font-family:var(--head); font-size:30px; font-weight:700; letter-spacing:8px;
    color:var(--frost); margin:0; line-height:1;
  }
  .sub {
    text-align:center; font-size:9px; letter-spacing:2.6px; text-transform:uppercase;
    color:var(--faint); margin:9px 0 26px;
  }
  label {
    display:block; font-size:9px; letter-spacing:1.4px; text-transform:uppercase;
    color:var(--faint); margin:14px 0 5px;
  }
  input {
    width:100%; background:rgba(8,17,28,.8); color:var(--frost);
    border:1px solid var(--line); border-radius:5px; padding:9px 11px;
    font-family:var(--ui); font-size:13px; letter-spacing:.3px;
    transition:border-color .15s, box-shadow .15s;
  }
  input:focus {
    outline:none; border-color:var(--ice-deep);
    box-shadow:0 0 0 3px rgba(61,159,214,.15);
  }
  .row { display:flex; gap:8px; margin-top:22px; }
  button {
    font-family:var(--ui); font-size:11px; letter-spacing:1.2px; text-transform:uppercase;
    border-radius:5px; cursor:pointer; padding:10px 14px;
    transition:background .15s, border-color .15s, color .15s;
  }
  .primary {
    flex:1; background:linear-gradient(180deg,#1f4d70,rgba(23,57,84,.55));
    border:1px solid var(--ice-deep); color:var(--frost);
  }
  .primary:hover { background:linear-gradient(180deg,#2a6a94,rgba(23,57,84,.55)); }
  .ghost { background:rgba(28,51,73,.5); border:1px solid var(--line); color:var(--dim); }
  .ghost:hover { border-color:var(--line-bright); color:var(--text); }
  button:disabled { opacity:.5; cursor:default; }
  #msg { margin-top:16px; font-size:11px; min-height:32px; line-height:1.55; }
  #msg.err { color:var(--danger); } #msg.ok { color:var(--good); }
  .hint {
    margin-top:20px; padding-top:14px; border-top:1px solid var(--line);
    font-size:9px; color:#3f5670; line-height:1.8; letter-spacing:.3px;
  }
  .hint code { color:var(--faint); font-family:var(--ui); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.45} }
  .pulse { animation:pulse 1.6s ease-in-out infinite; }
</style>
</head>
<body>

<div id="bg">
  <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#040810"/><stop offset="38%" stop-color="#081725"/>
        <stop offset="68%" stop-color="#0e2c42"/><stop offset="100%" stop-color="#14415c"/>
      </linearGradient>
      <linearGradient id="wat" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#17506f"/><stop offset="45%" stop-color="#0e304a"/>
        <stop offset="100%" stop-color="#071b28"/>
      </linearGradient>
      <linearGradient id="au" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#3fe0b0" stop-opacity="0"/>
        <stop offset="32%" stop-color="#3fe0b0" stop-opacity=".5"/>
        <stop offset="62%" stop-color="#5aa8ff" stop-opacity=".4"/>
        <stop offset="100%" stop-color="#9d7ce8" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#1d4863"/><stop offset="100%" stop-color="#122f45"/>
      </linearGradient>
      <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#16374f"/><stop offset="100%" stop-color="#0c2334"/>
      </linearGradient>
      <filter id="bl"><feGaussianBlur stdDeviation="34"/></filter>
      <radialGradient id="vig" cx="50%" cy="46%" r="72%">
        <stop offset="52%" stop-color="#000" stop-opacity="0"/>
        <stop offset="100%" stop-color="#000" stop-opacity=".7"/>
      </radialGradient>
    </defs>

    <rect width="1600" height="900" fill="url(#sky)"/>
    <g id="stars" fill="#dceefc"></g>

    <g filter="url(#bl)">
      <path fill="url(#au)" d="M-200 250 C 200 120, 520 300, 880 180 S 1500 240, 1800 130 L1800 330 C1500 430, 1160 300, 880 380 S 200 320, -200 430 Z">
        <animateTransform attributeName="transform" type="translate" values="0 0; 60 -22; -40 14; 0 0" dur="26s" repeatCount="indefinite"/>
      </path>
    </g>

    <path fill="url(#far)" d="M-100 560 L 90 430 L 190 480 L 320 360 L 430 452 L 520 400 L 640 470 L 760 372 L 880 462 L 1010 402 L 1130 476 L 1250 392 L 1380 470 L 1500 420 L 1700 520 L 1700 620 L -100 620 Z"/>
    <path fill="#cfe4f2" opacity=".45" d="M 320 360 L 366 398 L 344 402 L 372 428 L 268 428 L 296 400 L 276 396 Z M 760 372 L 806 412 L 782 416 L 812 442 L 706 442 L 736 414 L 714 410 Z M 1250 392 L 1294 430 L 1272 434 L 1300 458 L 1198 458 L 1226 432 L 1206 428 Z"/>
    <path fill="url(#mid)" d="M-100 620 L 130 512 L 260 570 L 400 486 L 540 566 L 700 500 L 860 578 L 1020 508 L 1180 580 L 1340 520 L 1480 586 L 1700 540 L 1700 700 L -100 700 Z"/>

    <rect x="-100" y="668" width="1800" height="300" fill="url(#wat)"/>
    <g opacity=".2" fill="#9fd8f4">
      <rect x="-100" y="690" width="600" height="1.6"><animate attributeName="x" values="-100;60;-100" dur="13s" repeatCount="indefinite"/></rect>
      <rect x="700" y="726" width="520" height="1.4"><animate attributeName="x" values="700;560;700" dur="17s" repeatCount="indefinite"/></rect>
      <rect x="200" y="770" width="700" height="1.2"><animate attributeName="x" values="200;340;200" dur="21s" repeatCount="indefinite"/></rect>
    </g>

    <path fill="#0b1d2c" d="M-100 790 C 180 754, 420 786, 640 764 C 900 738, 1140 782, 1380 756 C 1500 744, 1620 762, 1700 750 L 1700 980 L -100 980 Z"/>
    <g fill="#04101a">
      <path d="M 660 764 L 700 726 L 860 726 L 900 764 Z"/><rect x="672" y="762" width="216" height="34"/>
      <path d="M 520 776 L 548 750 L 576 776 Z"/><rect x="528" y="774" width="40" height="24"/>
      <path d="M 960 772 L 986 748 L 1012 772 Z"/><rect x="968" y="770" width="38" height="26"/>
    </g>
    <g fill="#ffcf7a">
      <rect x="690" y="776" width="5" height="7" opacity=".85"><animate attributeName="opacity" values=".85;.5;.85" dur="3.4s" repeatCount="indefinite"/></rect>
      <rect x="820" y="776" width="5" height="7" opacity=".85"><animate attributeName="opacity" values=".85;.45;.85" dur="4.6s" repeatCount="indefinite"/></rect>
      <rect x="540" y="782" width="5" height="7" opacity=".8"><animate attributeName="opacity" values=".8;.4;.8" dur="5.2s" repeatCount="indefinite"/></rect>
    </g>

    <rect width="1600" height="900" fill="url(#vig)"/>
  </svg>
</div>

<div class="card">
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#7fd4ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2.5 20.5 7v10L12 21.5 3.5 17V7z"/>
      <path d="M12 7.5 16 10v4l-4 2.5L8 14v-4z" opacity=".7"/>
    </svg>
    <h1>TRANORD</h1>
  </div>
  <p class="sub">fiyort krallığı · dev girişi</p>

  <label for="email">E-posta</label>
  <input id="email" type="email" value="dev@tranord.local" autocomplete="username">

  <label for="pw">Şifre (en az 6 karakter)</label>
  <input id="pw" type="password" value="tranord123" autocomplete="current-password">

  <div class="row">
    <button id="go" class="primary">Gir / Hesap aç</button>
    <button id="reset" class="ghost">Sıfırla</button>
  </div>

  <div id="msg"></div>

  <div class="hint">
    Sunucu: <code id="srv"></code><br>
    Hesap yoksa otomatik oluşturulur. Başka port için: <code>?server=http://localhost:3312</code>
  </div>
</div>

<script>
  // Yıldızlar
  (function () {
    let s = 7 * 9301 + 49297;
    const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const g = document.getElementById('stars');
    let out = '';
    for (let i = 0; i < 110; i++) {
      const x = (rnd() * 1600).toFixed(0), y = (rnd() * 380).toFixed(0);
      const r = (0.4 + rnd() * 1.1).toFixed(2), o = (0.25 + rnd() * 0.6).toFixed(2);
      const d = (2 + rnd() * 5).toFixed(1);
      out += '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" opacity="' + o + '">'
           + '<animate attributeName="opacity" values="' + o + ';' + (o * 0.3).toFixed(2) + ';' + o + '" dur="' + d + 's" repeatCount="indefinite"/></circle>';
    }
    g.innerHTML = out;
  })();

  const qs = new URLSearchParams(location.search);
  const SERVER = qs.get('server') || 'http://localhost:3311';
  document.getElementById('srv').textContent = SERVER;

  const msg = document.getElementById('msg');
  const go = document.getElementById('go');
  const say = (t, c) => { msg.className = c || ''; msg.textContent = t; };

  async function post(p, body) {
    const res = await fetch(SERVER + p, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    let data = {};
    try { data = await res.json(); } catch (_) {}
    return { ok: res.ok, status: res.status, data };
  }

  go.addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('pw').value;
    if (!email || password.length < 6) return say('E-posta gerekli, şifre en az 6 karakter.', 'err');

    go.disabled = true;
    msg.className = 'pulse';
    msg.textContent = 'Fiyorda bağlanıyor…';
    try {
      let r = await post('/auth/login', { email, password });
      if (!r.ok && r.status === 401) {
        say('Hesap bulunamadı, oluşturuluyor…');
        r = await post('/auth/register', { email, password });
      }
      if (!r.ok) { go.disabled = false; return say('Hata: ' + (r.data.error || r.status), 'err'); }
      localStorage.setItem('tranord_token', r.data.token);
      say('Giriş başarılı — köye geçiliyor…', 'ok');
      location.href = '/?token=' + encodeURIComponent(r.data.token);
    } catch (err) {
      go.disabled = false;
      say('Sunucuya ulaşılamadı (' + SERVER + '). SERVER penceresi açık mı?', 'err');
    }
  });

  document.getElementById('reset').addEventListener('click', () => {
    localStorage.removeItem('tranord_token');
    say('Token temizlendi.', 'ok');
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Enter') go.click(); });
</script>
</body>
</html>
