<!doctype html>
<meta charset="utf-8">
<title>TraNord — köy şekli: 3 örnek</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; background:#050a12; color:#cfe0ee; font-family: Jost, system-ui, sans-serif; }
  .wrap { display:flex; height:100vh; }
  .stage { flex:1; display:grid; place-items:center; overflow:hidden;
           perspective:1600px; perspective-origin:50% 34%; }
  svg { width:min(100%, 97vh); height:auto; aspect-ratio:1/1; transform-style:preserve-3d; }
  .panel { width:262px; padding:16px 15px; background:rgba(10,20,32,.82);
           border-left:1px solid rgba(140,180,220,.18); overflow-y:auto; }
  h1 { font-family:'Cormorant Garamond',Georgia,serif; font-size:18px; letter-spacing:1px;
       margin:0 0 4px; color:#dfeaf5; font-weight:600; }
  .sub { font-size:10px; color:#6f8497; margin-bottom:10px; line-height:1.5; }
  label { display:block; font-size:9.5px; letter-spacing:1.3px; text-transform:uppercase;
          color:#7f95a8; margin:13px 0 3px; }
  input[type=range] { width:100%; }
  .val { font-family:ui-monospace,monospace; font-size:11.5px; color:#8fbcff; }
  .row { display:flex; gap:5px; flex-wrap:wrap; margin-top:5px; }
  button { background:rgba(31,77,112,.45); color:#cfe0ee; border:1px solid rgba(140,180,220,.28);
           border-radius:5px; padding:6px 9px; font-size:10.5px; cursor:pointer; font-family:inherit; }
  button.on { background:rgba(143,188,255,.32); border-color:#8fbcff; color:#eaf4ff; }
  .desc { margin-top:10px; padding:9px 10px; border-radius:6px; background:rgba(8,16,26,.7);
          border:1px solid rgba(140,180,220,.14); font-size:10.5px; line-height:1.6; color:#9fb4c8; }
  .desc b { color:#dfeaf5; }
</style>
<div class="wrap">
  <div class="stage"><svg id="svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet"></svg></div>
  <div class="panel">
    <h1>Köy şekli</h1>
    <div class="sub">Gerçek köy verin, gerçek bina görselleri ve gerçek komşu tarlalarınla.</div>

    <label>Şekil</label>
    <div class="row" id="shape"></div>
    <div class="desc" id="shapeDesc"></div>

    <label>Yol genişliği <span class="val" id="vRoad">11</span></label>
    <input type="range" id="road" min="0" max="24" value="11">
    <label>Bina karo boyu <span class="val" id="vTile">0.84</span></label>
    <input type="range" id="tile" min="60" max="100" value="84">
    <label>Sur seviyesi <span class="val" id="vSur">6</span></label>
    <input type="range" id="sur" min="0" max="20" value="6">
    <label>Hendek seviyesi <span class="val" id="vHen">3</span></label>
    <input type="range" id="hen" min="0" max="20" value="3">

    <label>Görünüm</label>
    <div class="row">
      <button id="tTilt" class="on">Eğim</button>
      <button id="tFields" class="on">Tarlalar</button>
      <button id="tImg" class="on">Bina görselleri</button>
    </div>
  </div>
</div>
<script>
// ── GERÇEK VERİ ─────────────────────────────────────────────────────
const VB = {"0,0":{"t":"anaBina","l":10},"1,0":{"t":"keresteci","l":2},"0,1":{"t":"tuglaci","l":2},"-1,1":{"t":"tasci","l":2},"-1,0":{"t":"demirci","l":2},"0,-1":{"t":"degirmen","l":8},"1,-1":{"t":"firin","l":8},"-2,0":{"t":"zirh","l":1},"-1,-1":{"t":"silahci","l":3},"-2,2":{"t":"ev","l":5},"-1,2":{"t":"ev","l":5},"1,1":{"t":"islenmisMalDepo","l":14},"2,-2":{"t":"ahir","l":8},"2,0":{"t":"tahilAmbar","l":12},"3,-1":{"t":"granary","l":13},"3,-2":{"t":"hammaddeDepo","l":13},"-3,1":{"t":"cephane","l":2},"-3,0":{"t":"atolye","l":1},"-2,-1":{"t":"saglikCadiri","l":2},"1,-3":{"t":"loncaDemir","l":1},"1,-2":{"t":"kisla","l":4},"3,0":{"t":"loncaOdun","l":4},"2,1":{"t":"loncaTas","l":4},"1,2":{"t":"loncaKil","l":3},"0,3":{"t":"loncaTahil","l":2},"-3,2":{"t":"ev","l":3},"-1,3":{"t":"pazar","l":1}};
const KULE = { 1:1, 2:1, 3:1, 4:1, 6:1 };            // kurulu kule seviyeleri
// Köyün komşu DÜNYA hex'leri = üretim tarlaları (ring 1)
const FIELDS = [
  { dir:0, t:'odun',  l:4 },   // 1,0
  { dir:5, t:'kil',   l:4 },   // 1,-1
  { dir:4, t:'tas',   l:4 },   // 0,-1
  { dir:3, t:'demir', l:4 },   // -1,0
  { dir:2, t:'tahil', l:5 },   // -1,1
  { dir:1, t:'tahil', l:5 },   // 0,1
];
const RES_COL = { odun:'#6f9c4a', kil:'#c07a44', tas:'#9aa4ad', demir:'#7d95b8', tahil:'#d7b martin' };
const RES_COLOR = { odun:'#6f9c4a', kil:'#c07a44', tas:'#9aa4ad', demir:'#7d95b8', tahil:'#d9b64c' };
const RES_AD = { odun:'Odun', kil:'Kil', tas:'Taş', demir:'Demir', tahil:'Tahıl' };
const IMG = (t) => `/src/assets/buildings/${t}.jpg`;

const SQRT3 = Math.sqrt(3), CX = 500, CY = 500, S = 44;
const RING1 = [[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
const RING2 = [[2,0],[2,-1],[2,-2],[1,-2],[0,-2],[-1,-1],[-2,0],[-2,1],[-2,2],[-1,2],[0,2],[1,1]];
const RING3 = [[3,0],[3,-1],[3,-2],[3,-3],[2,-3],[1,-3],[0,-3],[-1,-2],[-2,-1],[-3,0],[-3,1],
               [-3,2],[-3,3],[-2,3],[-1,3],[0,3],[1,2],[2,1]];
const ALL = [[0,0], ...RING1, ...RING2, ...RING3];

const P = (q,r) => ({ x: CX + S*1.5*q, y: CY + S*((SQRT3/2)*q + SQRT3*r) });
const hexPts = (x,y,r,rot=0) => Array.from({length:6},(_,i)=>{
  const a=(Math.PI/3)*i + rot; return [x+r*Math.cos(a), y+r*Math.sin(a)];
});
const pts = a => a.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
const lerp = (a,b,t) => [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t];

// Düz altıgen sınır: köşeler 30+60k (düz-tepe hex kümesini saran yön)
const BORDER_R = 3*SQRT3*S;                       // = 5.196·S, ring3 merkezlerinden geçer
const border = (R) => Array.from({length:6},(_,k)=>{
  const a=(Math.PI/180)*(30+60*k);
  return [CX + R*Math.cos(a), CY + R*Math.sin(a)];
});
const NORMALS = Array.from({length:6},(_,k)=>{
  const a=(Math.PI/180)*(60*k);
  return [Math.cos(a), Math.sin(a)];
});
/** Hücre düz altıgenin TAMAMEN içinde mi? */
function cellInside(q,r,R) {
  const lim = R*Math.cos(Math.PI/6);
  const c = P(q,r);
  return hexPts(c.x,c.y,S).every(([x,y]) =>
    NORMALS.every(([nx,ny]) => (x-CX)*nx + (y-CY)*ny <= lim + 0.5));
}

const st = { shape:'S1', roadW:11, tile:0.84, sur:6, hen:3, tilt:true, fields:true, img:true };
const DESC = {
  S1: '<b>Ş1 · Kırpılmış altıgen</b> — sınır düz altıgen, kenara taşan hex\'ler o hatta kırpılıyor. Kenarda yarım karolar görünür, inşa alanı sayısı 37 olarak KALIR.',
  S2: '<b>Ş2 · Küçültülmüş altıgen</b> — yalnız altıgene tam sığan hücreler kalıyor. Tamamen düzgün bir altıgen, ama inşa alanı 37 → 19; mevcut binaların taşınması gerekir.',
  S3: '<b>Ş3 · Tek büyük altıgen ada</b> — zemin bölünmemiş tek altıgen; binalar onun içinde ızgarada duruyor, boş yerler çıplak zemin. Sur adanın kenarına oturur.',
};

function draw() {
  const R = BORDER_R;
  const B = border(R);
  const thick = (0.16 + Math.min(20,st.sur)*0.010) * S;
  const band  = (0.26 + Math.min(20,st.hen)*0.010) * S;
  const BERM  = 0.10 * S;
  const wallR = R + thick/2;
  const W = border(wallR);
  const mIn  = border(wallR + thick/2 + BERM);
  const mOut = border(wallR + thick/2 + BERM + band);
  const gateEdge = 1;                     // alt kenar
  const TR = st.tile * S;
  let g = '';

  g += `<defs>
    <radialGradient id="grd" cx="50%" cy="50%" r="64%">
      <stop offset="0%" stop-color="#3c5531" stop-opacity=".96"/>
      <stop offset="100%" stop-color="#1d2b18" stop-opacity=".8"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12384d"/><stop offset="100%" stop-color="#071a26"/>
    </linearGradient>
    <pattern id="tex" patternUnits="userSpaceOnUse" width="${(1.4*S).toFixed(0)}" height="${(1.4*S).toFixed(0)}">
      <image href="/src/assets/buildings/sur-doku.jpg" x="0" y="0"
        width="${(1.4*S).toFixed(0)}" height="${(1.4*S).toFixed(0)}" preserveAspectRatio="none"/>
    </pattern>
    <clipPath id="villageClip"><polygon points="${pts(B)}"/></clipPath>
  </defs>`;

  // ── KOMŞU DÜNYA HEX'LERİ (tarlalar) — surun dışında, kenar ortalarında ──
  if (st.fields) {
    const fr = S * 0.92;
    const outR = wallR + thick/2 + BERM + band + fr*0.95;
    FIELDS.forEach(f => {
      const a = (Math.PI/180) * (60*f.dir);      // kenar normali yönü
      const fx = CX + outR*Math.cos(a), fy = CY + outR*Math.sin(a);
      const hp = hexPts(fx, fy, fr);
      const col = RES_COLOR[f.t] || '#6f9c4a';
      g += `<polygon points="${pts(hp)}" fill="${col}" fill-opacity=".26"
               stroke="${col}" stroke-width="1.6" stroke-opacity=".7"/>`;
      g += `<circle cx="${fx}" cy="${fy - fr*0.18}" r="${(fr*0.3).toFixed(1)}" fill="${col}" fill-opacity=".5"/>`;
      g += `<text x="${fx}" y="${(fy + fr*0.36).toFixed(1)}" text-anchor="middle"
               font-family="Jost,system-ui" font-size="11" fill="#dfeaf5"
               paint-order="stroke" stroke="rgba(6,10,18,.85)" stroke-width="3">${RES_AD[f.t]} ${f.l}</text>`;
    });
    g += `<text x="${CX}" y="${(CY - outR - fr*1.15).toFixed(1)}" text-anchor="middle"
             font-family="Jost,system-ui" font-size="11" letter-spacing="1.4"
             fill="rgba(159,180,200,.75)">KÖYÜN TARLALARI (dünya haritası)</text>`;
  }

  // ── ZEMİN ──
  g += `<polygon points="${pts(B)}" fill="url(#grd)"/>`;

  // ── HENDEK ──
  if (st.hen > 0) {
    g += `<path d="M${pts(mOut).replace(/ /g,'L')}Z M${pts(mIn).replace(/ /g,'L')}Z"
             fill="url(#water)" fill-rule="evenodd" opacity=".95"/>`;
    g += `<polygon points="${pts(mOut)}" fill="none" stroke="#0a1c26" stroke-width="3"/>`;
    g += `<polygon points="${pts(mIn)}" fill="none" stroke="rgba(150,210,240,.3)" stroke-width="1.4"/>`;
  }

  // ── KÖY İÇİ: yollar + karolar (Ş1'de düz altıgene kırpılır) ──
  const cells = st.shape === 'S2' ? ALL.filter(([q,r]) => cellInside(q,r,R)) : ALL;
  let inner = '';

  // Yollar: hex kenarları boyunca
  if (st.roadW > 0) {
    const seen = new Set(), segs = [];
    for (const [q,r] of cells) {
      const c = P(q,r);
      for (let i=0;i<6;i++) {
        const a1=(Math.PI/3)*i, a2=(Math.PI/3)*((i+1)%6);
        const p1=[c.x+S*Math.cos(a1), c.y+S*Math.sin(a1)];
        const p2=[c.x+S*Math.cos(a2), c.y+S*Math.sin(a2)];
        const k=`${((p1[0]+p2[0])/2).toFixed(0)}_${((p1[1]+p2[1])/2).toFixed(0)}`;
        if (seen.has(k)) continue;
        seen.add(k); segs.push([p1,p2]);
      }
    }
    const line = (p1,p2,col,wd) =>
      `<line x1="${p1[0].toFixed(1)}" y1="${p1[1].toFixed(1)}" x2="${p2[0].toFixed(1)}" y2="${p2[1].toFixed(1)}"
             stroke="${col}" stroke-width="${wd}" stroke-linecap="round"/>`;
    for (const [p1,p2] of segs) inner += line(p1,p2,'#241d13', st.roadW+4);
    for (const [p1,p2] of segs) inner += line(p1,p2,'#6b5c42', st.roadW);
    for (const [p1,p2] of segs) inner += line(p1,p2,'#83734f', Math.max(1, st.roadW*0.42));
  }

  // Karolar
  for (const [q,r] of cells) {
    const key = q+','+r, p = P(q,r), b = VB[key];
    const hp = hexPts(p.x, p.y, TR);
    const cid = `c${q}_${r}`.replace(/-/g,'m');
    if (b) {
      inner += `<clipPath id="${cid}"><polygon points="${pts(hp)}"/></clipPath>`;
      inner += `<polygon points="${pts(hp)}" fill="#25301e"/>`;
      if (st.img) {
        inner += `<image href="${IMG(b.t)}" x="${(p.x-TR).toFixed(1)}" y="${(p.y-TR).toFixed(1)}"
                    width="${(TR*2).toFixed(1)}" height="${(TR*2).toFixed(1)}"
                    clip-path="url(#${cid})" preserveAspectRatio="xMidYMid slice"/>`;
      }
      inner += `<polygon points="${pts(hp)}" fill="none" stroke="rgba(196,220,244,.42)" stroke-width="1.5"/>`;
      inner += `<text x="${p.x}" y="${(p.y+TR*0.7).toFixed(1)}" text-anchor="middle"
                  font-family="'Cormorant Garamond',Georgia,serif" font-size="12" font-weight="600"
                  fill="#eaf4fb" paint-order="stroke" stroke="rgba(6,10,18,.85)" stroke-width="3">LVL ${b.l}</text>`;
    } else if (st.shape === 'S3') {
      // Tek ada: boş yer çıplak zemin, yalnız ince bir işaret
      inner += `<circle cx="${p.x}" cy="${p.y}" r="${(TR*0.30).toFixed(1)}" fill="none"
                  stroke="rgba(196,220,244,.28)" stroke-width="1.4" stroke-dasharray="4 4"/>`;
      inner += `<path d="M${p.x-7} ${p.y} h14 M${p.x} ${p.y-7} v14" stroke="rgba(196,220,244,.4)" stroke-width="1.8"/>`;
    } else {
      inner += `<polygon points="${pts(hp)}" fill="#2f4a28" fill-opacity=".7"
                  stroke="rgba(150,190,120,.32)" stroke-width="1.2"/>`;
      inner += `<path d="M${p.x-8} ${p.y} h16 M${p.x} ${p.y-8} v16" stroke="rgba(196,220,244,.32)" stroke-width="2"/>`;
    }
  }

  g += st.shape === 'S1' ? `<g clip-path="url(#villageClip)">${inner}</g>` : `<g>${inner}</g>`;

  // ── SUR ──
  if (st.sur > 0) {
    g += `<polygon points="${pts(W)}" fill="none" stroke="#221e19" stroke-width="${thick+7}" stroke-linejoin="round"/>`;
    g += `<polygon points="${pts(W)}" fill="none" stroke="url(#tex)" stroke-width="${thick}" stroke-linejoin="round"/>`;
    g += `<polygon points="${pts(W)}" fill="none" stroke="rgba(74,104,136,.18)" stroke-width="${thick}" stroke-linejoin="round"/>`;
    for (let i=0;i<6;i++) {
      const a=W[i], b=W[(i+1)%6];
      const n=Math.max(4, Math.round(Math.hypot(b[0]-a[0],b[1]-a[1])/(0.24*S)));
      for (let k=0;k<=n;k+=2) {
        const t=k/n;
        if (i===gateEdge && t>0.42 && t<0.58) continue;
        const p=lerp(a,b,t);
        const dx=p[0]-CX, dy=p[1]-CY, L=Math.hypot(dx,dy)||1;
        g += `<circle cx="${(p[0]+dx/L*thick/2).toFixed(1)}" cy="${(p[1]+dy/L*thick/2).toFixed(1)}"
                 r="${(thick*0.17).toFixed(1)}" fill="#8f8578" opacity=".85"/>`;
      }
    }
    // kapı
    const gp = lerp(W[gateEdge], W[(gateEdge+1)%6], 0.5);
    const dx=gp[0]-CX, dy=gp[1]-CY, L=Math.hypot(dx,dy)||1;
    const g1=[gp[0]-dx/L*thick*0.9, gp[1]-dy/L*thick*0.9], g2=[gp[0]+dx/L*thick*0.9, gp[1]+dy/L*thick*0.9];
    g += `<line x1="${g1[0]}" y1="${g1[1]}" x2="${g2[0]}" y2="${g2[1]}" stroke="#2a1c10" stroke-width="${thick*1.5}"/>`;
    g += `<line x1="${g1[0]}" y1="${g1[1]}" x2="${g2[0]}" y2="${g2[1]}" stroke="#6b4a28" stroke-width="${thick*1.1}"/>`;
    // kapıdan içeri yol
    const inn=[gp[0]-dx/L*(thick+st.roadW*1.6), gp[1]-dy/L*(thick+st.roadW*1.6)];
    g += `<line x1="${gp[0]}" y1="${gp[1]}" x2="${inn[0]}" y2="${inn[1]}" stroke="#6b5c42" stroke-width="${st.roadW+2}"/>`;
  } else {
    g += `<polygon points="${pts(W)}" fill="none" stroke="#4a4032" stroke-width="6"
             stroke-dasharray="14 9" opacity=".7" stroke-linejoin="round"/>`;
  }

  // ── KULELER: düz altıgenin ALTI KÖŞESİ ──
  W.forEach((p,i) => {
    const lv = KULE[i+1] || 0;
    const rr = Math.max(thick*1.35, 0.30*S);
    if (lv > 0) {
      g += `<polygon points="${pts(hexPts(p[0],p[1],rr+3,Math.PI/6))}" fill="#221e19"/>`;
      g += `<polygon points="${pts(hexPts(p[0],p[1],rr,Math.PI/6))}" fill="url(#tex)"/>`;
      g += `<polygon points="${pts(hexPts(p[0],p[1],rr,Math.PI/6))}" fill="rgba(74,104,136,.18)"/>`;
      for (let k=0;k<6;k++) {
        const a=(Math.PI/3)*k + Math.PI/6;
        g += `<circle cx="${(p[0]+rr*0.86*Math.cos(a)).toFixed(1)}" cy="${(p[1]+rr*0.86*Math.sin(a)).toFixed(1)}"
                 r="${(rr*0.17).toFixed(1)}" fill="#8f8578" opacity=".9"/>`;
      }
      g += `<polygon points="${pts(hexPts(p[0],p[1],rr,Math.PI/6))}" fill="none"
               stroke="rgba(228,240,250,.3)" stroke-width="1.2"/>`;
      g += `<text x="${p[0]}" y="${(p[1]+4).toFixed(1)}" text-anchor="middle"
               font-family="ui-monospace,monospace" font-size="11" fill="#ffc9c9"
               paint-order="stroke" stroke="rgba(6,10,18,.9)" stroke-width="3">${lv}</text>`;
    } else {
      g += `<polygon points="${pts(hexPts(p[0],p[1],rr,Math.PI/6))}" fill="#141d26" fill-opacity=".85"
               stroke="rgba(255,150,150,.5)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
      g += `<path d="M${p[0]-6} ${p[1]} h12 M${p[0]} ${p[1]-6} v12" stroke="rgba(255,150,150,.6)" stroke-width="1.8"/>`;
    }
  });

  const svg = document.getElementById('svg');
  svg.innerHTML = g;
  svg.style.transform = st.tilt ? 'rotateX(17deg)' : 'none';
  const bb = svg.getBBox(), pad = 16;
  const side = Math.max(bb.width, bb.height) + pad*2;
  svg.setAttribute('viewBox',
    `${(bb.x+bb.width/2-side/2).toFixed(0)} ${(bb.y+bb.height/2-side/2).toFixed(0)} ${side.toFixed(0)} ${side.toFixed(0)}`);
  document.getElementById('shapeDesc').innerHTML = DESC[st.shape] +
    `<br><br>Görünen inşa alanı: <b>${cells.length}</b>`;
}

// ── kontroller ──
const h = document.getElementById('shape');
[['S1','Ş1 kırpılmış'],['S2','Ş2 küçültülmüş'],['S3','Ş3 tek ada']].forEach(([v,t]) => {
  const b = document.createElement('button');
  b.textContent = t;
  if (st.shape === v) b.className = 'on';
  b.onclick = () => { st.shape = v; [...h.children].forEach(c=>c.className=''); b.className='on'; draw(); };
  h.appendChild(b);
});
const bind = (id,key,out,f=v=>v) => {
  const el = document.getElementById(id);
  el.oninput = () => { st[key]=f(+el.value); document.getElementById(out).textContent=st[key]; draw(); };
};
bind('road','roadW','vRoad');
bind('tile','tile','vTile', v=>+(v/100).toFixed(2));
bind('sur','sur','vSur');
bind('hen','hen','vHen');
const tog=(id,key)=>document.getElementById(id).onclick=e=>{ st[key]=!st[key]; e.target.className=st[key]?'on':''; draw(); };
tog('tTilt','tilt'); tog('tFields','fields'); tog('tImg','img');
draw();
</script>
